# LogoSwap — docker-compose example for Ubuntu / on-prem deployment.
#
# NOT consumed by default — copy this file to docker-compose.yml at deploy time and
# adapt (volumes, env, ports, optional reverse proxy). D-A1 keeps the app image free
# of nginx; the reverse proxy is the deployment target's responsibility.
#
# Usage:
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d
#
# Health:  curl http://localhost:8000/health   (returns 5-field JSON; see README)

services:
  app:
    build:
      context: .
    image: logoswap:local
    container_name: logoswap
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Session state (originals/work/outputs/pristine). Survives container restarts.
      - ./data:/data
    environment:
      # Empty = root mount. For strip-prefix proxying behind nginx (see commented
      # block below), set APP_BASE_PATH=/pdf-logo (experimental — Pitfall 5).
      APP_BASE_PATH: ""
      UVICORN_WORKERS: "2"
      PROCESS_TIMEOUT_SECONDS: "60"
      SESSION_TTL_SECONDS: "3600"
      DATA_DIR: "/data"
      LOGOS_DIR: "/app/logos"
      # Cross-origin embedding (Phase 5 placeholder; default off).
      CORS_ALLOW_ORIGINS: ""
    # The Dockerfile already defines HEALTHCHECK using stdlib urllib (Pitfall 2);
    # compose inherits it automatically — no override required here.

# -----------------------------------------------------------------------------------
# OPTIONAL: Ubuntu corporate-portal reverse proxy (strip-prefix at /pdf-logo/).
# Uncomment the block below + set APP_BASE_PATH=/pdf-logo on the `app` service.
# The trailing slash in `proxy_pass http://app:8000/;` strips the /pdf-logo/ prefix
# before forwarding. Sub-domain (pdf-logo.internal → root mount) is the recommended
# stable alternative — README §"Known Limitations" explains the trade-off.
